<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Proposed script descent and borrowing</title><desc id="desc">Stone Register gives rise to Early Ink and then the original Classical hand. Ridge, Delta and Island branch from Classical. Civic descends from Delta and borrows graphic features from Ridge and Island.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#295c65" stroke-width="1.5"/></marker></defs><rect width="1200" height="760" fill="white"/><g font-family="Georgia,serif"><text x="36" y="40" font-size="28" fill="#1b292c">A possible genealogy, not a recovered history</text><path d="M600 155V165H600V190" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 270V280H600V305" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 385V420H210V445" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 385V420H600V445" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 385V420H990V445" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 525V565H600V590" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M210 525C210 620 370 630 480 630M990 525C990 620 830 630 720 630" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><g><rect x="480" y="75" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="600" y="106" text-anchor="middle" font-size="21" fill="#1b292c">Stone Register</text><text x="600" y="132" text-anchor="middle" font-size="15" fill="#566569">−700 to −350</text></g><g><rect x="480" y="190" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="600" y="221" text-anchor="middle" font-size="21" fill="#1b292c">Early Ink</text><text x="600" y="247" text-anchor="middle" font-size="15" fill="#566569">−350 to 0</text></g><g><rect x="480" y="305" width="240" height="80" rx="5" fill="#295c65" stroke="#b6c8ca"/><text x="600" y="336" text-anchor="middle" font-size="21" fill="white">Classical</text><text x="600" y="362" text-anchor="middle" font-size="15" fill="white">0 to 300 · original</text></g><g><rect x="90" y="445" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="210" y="476" text-anchor="middle" font-size="21" fill="#1b292c">Ridge Cut</text><text x="210" y="502" text-anchor="middle" font-size="15" fill="#566569">300 to 900</text></g><g><rect x="480" y="445" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="600" y="476" text-anchor="middle" font-size="21" fill="#1b292c">Delta Cursive</text><text x="600" y="502" text-anchor="middle" font-size="15" fill="#566569">300 to 900</text></g><g><rect x="870" y="445" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="990" y="476" text-anchor="middle" font-size="21" fill="#1b292c">Island Bookhand</text><text x="990" y="502" text-anchor="middle" font-size="15" fill="#566569">300 to 1000</text></g><g><rect x="480" y="590" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="600" y="621" text-anchor="middle" font-size="21" fill="#1b292c">Civic Print</text><text x="600" y="647" text-anchor="middle" font-size="15" fill="#566569">900 onward</text></g></g><g font-family="Arial,sans-serif" font-size="16" fill="#566569"><path d="M36 716H100" stroke="#295c65" stroke-width="2"/><text x="112" y="721">descent</text><path d="M260 716H324" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6"/><text x="336" y="721">graphic borrowing</text><text x="730" y="721">Dates are fictional, relative to year 0.</text></g></svg>