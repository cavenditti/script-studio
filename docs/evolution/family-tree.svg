<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc"><title id="title">Proposed script descent and borrowing</title><desc id="desc">Stone Register branches into the Ridge Alphabet, which leads to Upland Capitals, and into Ridge Cut, which leads to Early Ink. Early Ink gives rise to Classical, with Delta and Island, and to the Reed Seals, which lead to Harbor Blocks and finally Harbor Roundels. Dashed lines mark graphic borrowing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#295c65" stroke-width="1.5"/></marker></defs><rect width="1400" height="930" fill="white"/><g font-family="Georgia,serif"><text x="36" y="40" font-size="28" fill="#1b292c">One ancestor, different units of writing</text><path d="M590 160V175H220V200" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M590 160V175H880V200" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 280V295H220V320" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 280V295H880V320" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 400V435H590V460" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M590 540V585H440V610" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M590 540V585H740V610" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 400V435H1170V460" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M1170 540V585H1170V610" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M1170 690V715H1170V740" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M1050 650H862" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><path d="M220 280V292H40V872H1340V650H1292" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><g><rect x="470" y="80" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="590" y="111" text-anchor="middle" font-size="21" fill="#1b292c">Stone Register</text><text x="590" y="137" text-anchor="middle" font-size="15" fill="#566569">−700 to −550</text></g><g><rect x="100" y="200" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="220" y="231" text-anchor="middle" font-size="21" fill="#1b292c">Ridge Alphabet</text><text x="220" y="257" text-anchor="middle" font-size="15" fill="#566569">−550 to −350</text></g><g><rect x="760" y="200" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="880" y="231" text-anchor="middle" font-size="21" fill="#1b292c">Ridge Cut</text><text x="880" y="257" text-anchor="middle" font-size="15" fill="#566569">−550 to −350</text></g><g><rect x="100" y="320" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="220" y="351" text-anchor="middle" font-size="21" fill="#1b292c">Upland Capitals</text><text x="220" y="377" text-anchor="middle" font-size="15" fill="#566569">−350 onward</text></g><g><rect x="760" y="320" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="880" y="351" text-anchor="middle" font-size="21" fill="#1b292c">Early Ink</text><text x="880" y="377" text-anchor="middle" font-size="15" fill="#566569">−350 to 0</text></g><g><rect x="470" y="460" width="240" height="80" rx="5" fill="#295c65" stroke="#b6c8ca"/><text x="590" y="491" text-anchor="middle" font-size="21" fill="white">Classical</text><text x="590" y="517" text-anchor="middle" font-size="15" fill="white">0 to 300 · original</text></g><g><rect x="320" y="610" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="440" y="641" text-anchor="middle" font-size="21" fill="#1b292c">Delta Cursive</text><text x="440" y="667" text-anchor="middle" font-size="15" fill="#566569">300 to 900</text></g><g><rect x="620" y="610" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="740" y="641" text-anchor="middle" font-size="21" fill="#1b292c">Island Bookhand</text><text x="740" y="667" text-anchor="middle" font-size="15" fill="#566569">300 to 1000</text></g><g><rect x="1050" y="460" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="1170" y="491" text-anchor="middle" font-size="21" fill="#1b292c">Reed Seals</text><text x="1170" y="517" text-anchor="middle" font-size="15" fill="#566569">0 to 850</text></g><g><rect x="1050" y="610" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="1170" y="641" text-anchor="middle" font-size="21" fill="#1b292c">Harbor Blocks</text><text x="1170" y="667" text-anchor="middle" font-size="15" fill="#566569">850 to 1300</text></g><g><rect x="1050" y="740" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="1170" y="771" text-anchor="middle" font-size="21" fill="#1b292c">Harbor Roundels</text><text x="1170" y="797" text-anchor="middle" font-size="15" fill="#566569">1300 onward</text></g></g><g font-family="Arial,sans-serif" font-size="16" fill="#566569"><path d="M36 905H100" stroke="#295c65" stroke-width="2"/><text x="112" y="910">descent</text><path d="M260 905H324" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6"/><text x="336" y="910">graphic borrowing</text><text x="730" y="910">Dates and branches remain provisional.</text></g></svg>