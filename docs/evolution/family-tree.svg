<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="800" viewBox="0 0 1460 800" role="img" aria-labelledby="title desc"><title id="title">Proposed script descent and borrowing</title><desc id="desc">Stone Register branches into Upland Capitals and Early Ink. Early Ink gives rise to Classical and to the Reed Seals, which lead to Harbor Blocks and finally Harbor Roundels. Classical branches into Ridge, Delta and Island; Ridge gives rise to a free alphabet; Civic descends from Delta. Dashed lines mark graphic borrowing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#295c65" stroke-width="1.5"/></marker></defs><rect width="1460" height="800" fill="white"/><g font-family="Georgia,serif"><text x="36" y="40" font-size="28" fill="#1b292c">One ancestor, different units of writing</text><path d="M730 160V175H150V200" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 160V175H730V200" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 280V295H730V320" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 400V435H440V460" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 400V435H730V460" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 400V435H1020V460" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 540V585H730V610" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 280V295H1310V320" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 540V585H440V610" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M1310 400V435H1310V460" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M1310 540V585H1310V610" fill="none" stroke="#295c65" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 500C590 500 580 650 610 650" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><path d="M900 500C870 500 880 650 850 650" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><path d="M1140 500H1188" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><path d="M440 690V722H1452V500H1432" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><g><rect x="610" y="80" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="730" y="111" text-anchor="middle" font-size="21" fill="#1b292c">Stone Register</text><text x="730" y="137" text-anchor="middle" font-size="15" fill="#566569">−700 to −350</text></g><g><rect x="30" y="200" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="150" y="231" text-anchor="middle" font-size="21" fill="#1b292c">Upland Capitals</text><text x="150" y="257" text-anchor="middle" font-size="15" fill="#566569">−350 onward</text></g><g><rect x="610" y="200" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="730" y="231" text-anchor="middle" font-size="21" fill="#1b292c">Early Ink</text><text x="730" y="257" text-anchor="middle" font-size="15" fill="#566569">−350 to 0</text></g><g><rect x="610" y="320" width="240" height="80" rx="5" fill="#295c65" stroke="#b6c8ca"/><text x="730" y="351" text-anchor="middle" font-size="21" fill="white">Classical</text><text x="730" y="377" text-anchor="middle" font-size="15" fill="white">0 to 300 · original</text></g><g><rect x="320" y="460" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="440" y="491" text-anchor="middle" font-size="21" fill="#1b292c">Ridge Cut</text><text x="440" y="517" text-anchor="middle" font-size="15" fill="#566569">300 to 900</text></g><g><rect x="610" y="460" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="730" y="491" text-anchor="middle" font-size="21" fill="#1b292c">Delta Cursive</text><text x="730" y="517" text-anchor="middle" font-size="15" fill="#566569">300 to 900</text></g><g><rect x="900" y="460" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="1020" y="491" text-anchor="middle" font-size="21" fill="#1b292c">Island Bookhand</text><text x="1020" y="517" text-anchor="middle" font-size="15" fill="#566569">300 to 1000</text></g><g><rect x="610" y="610" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="730" y="641" text-anchor="middle" font-size="21" fill="#1b292c">Civic Print</text><text x="730" y="667" text-anchor="middle" font-size="15" fill="#566569">900 onward</text></g><g><rect x="1190" y="320" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="1310" y="351" text-anchor="middle" font-size="21" fill="#1b292c">Reed Seals</text><text x="1310" y="377" text-anchor="middle" font-size="15" fill="#566569">0 to 850</text></g><g><rect x="320" y="610" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="440" y="641" text-anchor="middle" font-size="21" fill="#1b292c">Ridge Alphabet</text><text x="440" y="667" text-anchor="middle" font-size="15" fill="#566569">750 onward</text></g><g><rect x="1190" y="460" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="1310" y="491" text-anchor="middle" font-size="21" fill="#1b292c">Harbor Blocks</text><text x="1310" y="517" text-anchor="middle" font-size="15" fill="#566569">850 to 1300</text></g><g><rect x="1190" y="610" width="240" height="80" rx="5" fill="#f4f6f6" stroke="#b6c8ca"/><text x="1310" y="641" text-anchor="middle" font-size="21" fill="#1b292c">Harbor Roundels</text><text x="1310" y="667" text-anchor="middle" font-size="15" fill="#566569">1300 onward</text></g></g><g font-family="Arial,sans-serif" font-size="16" fill="#566569"><path d="M36 770H100" stroke="#295c65" stroke-width="2"/><text x="112" y="775">descent</text><path d="M260 770H324" stroke="#8d6651" stroke-width="2" stroke-dasharray="7 6"/><text x="336" y="775">graphic borrowing</text><text x="730" y="775">Dates and branches remain provisional.</text></g></svg>